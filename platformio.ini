[env:esp32-s3-devkitc-1]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = bodmer/TFT_eSPI
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DUSER_SETUP_LOADED=1
  -DILI9341_DRIVER
  -DUSE_HSPI_PORT
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_MISO=-1
  -DTFT_CS=-1
  -DTFT_DC=13
  -DTFT_RST=14
  -DSPI_FREQUENCY=4000000